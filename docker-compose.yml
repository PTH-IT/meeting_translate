services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MODEL_CACHE_DIR=/app/models
      - MOCK_TRANSCRIPTION=false
      - MOCK_DIARIZATION=false
      - MOCK_VAD=false
      - TRANSLATION_SERVICE_URL=http://ai:8000
    volumes:
      - ./models:/app/models
    depends_on:
      - ai
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8003:80"
    depends_on:
      - backend

  ai:
    build:
      context: .
      dockerfile: ai/Dockerfile
    ports:
      - "8001:8000"
    environment:
      - MODEL_CACHE_DIR=/app/models
      - MOCK_TRANSLATION=false
      - MOCK_TRANSCRIPTION=false
      - MOCK_DIARIZATION=false
      - MOCK_VAD=false
    volumes:
      - ./models:/app/models
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

volumes:
  models:
    driver: local
