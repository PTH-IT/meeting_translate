services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8009:8000"
    environment:
      - MODEL_CACHE_DIR=/app/models
      - MOCK_TRANSCRIPTION=false
      - MOCK_DIARIZATION=false
      - MOCK_VAD=false
      - TRANSLATION_SERVICE_URL=http://ai:8001
    volumes:
      - ./models:/app/models
    depends_on:
      - ai
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "1901:80"
    depends_on:
      - backend

  ai:
    build:
      context: .
      dockerfile: ai/Dockerfile
    ports:
      - "8001:8000"
    environment:
      - MODEL_CACHE_DIR=/app/models
      - HF_HOME=/app/models/huggingface
      - TRANSFORMERS_CACHE=/app/models/huggingface/transformers
      - TORCH_HOME=/app/models/torch
      - WHISPER_CACHE_DIR=/app/models/whisperx
      - WHISPER_MODEL=small
      - MOCK_TRANSLATION=false
      - MOCK_TRANSCRIPTION=false
      - MOCK_DIARIZATION=false
      - MOCK_VAD=false
    volumes:
      - ./models:/app/models
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G

volumes:
  models:
    driver: local
